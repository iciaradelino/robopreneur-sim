# blockchain demo configuration (independent from the simulator's config.yaml)

chain:
  rpc: http://127.0.0.1:8545
  seed: 32                    # agent wallets are derived from seed + agent name
  # master = account 0 of `ganache --wallet.deterministic` (well-known test key, local only)
  master_key: "0x4f3edf983ac636a65a842ce7c78d9aa706d3b113bce9c46f30d7d21715b23b1d"
  gas_eth_per_agent: 10       # test ETH `register` sends each new agent wallet for gas
  poll_interval_s: 0.5        # how often each terminal checks for new events
  solc_version: 0.8.24
  evm_version: shanghai       # ganache v7 does not support cancun

token:
  total_supply: 100000        # IEC, all minted to the master by `deploy`

agents:                       # initial_wealth: IEC that `register` sends (and `fund` by default)
  robot_1:
    kind: robot
    initial_wealth: 2000
    services: [LabCleaning, ItemTransport, SurveillancePatrol]
  robot_2:
    kind: robot
    initial_wealth: 300
    services: [LabCleaning, ComponentRestock]
  human_1:
    kind: human
    initial_wealth: 2000
    services: [BatteryCharging, LabCleaning, SystemUpdate]
  human_2:
    kind: human
    initial_wealth: 2000
    services: [BatteryCharging, PowerSupply, FunctionalityTest]

auto:                         # `start`: the market runs on its own, like the simulator
  step_s: 0.25                # real seconds per simulated minute
  arrival_rate: 6             # new tasks per simulated hour, over all agents (Poisson)

# reward: IEC, lognormal around the median; duration: simulated minutes (as in ../config.yaml)
services:
  BatteryCharging:    {category: maintenance, reward: {median: 120, sigma_g: 0},    duration: 10}
  LabCleaning:        {category: cleaning,    reward: {median: 140, sigma_g: 0.35}, duration: {mean: 20, sd: 8, min: 6}}
  ItemTransport:      {category: logistics,   reward: {median: 130, sigma_g: 0.35}, duration: 20}
  PowerSupply:        {category: maintenance, reward: {median: 120, sigma_g: 0},    duration: 10}
  SystemUpdate:       {category: it,          reward: {median: 120, sigma_g: 0},    duration: 10}
  FunctionalityTest:  {category: it,          reward: {median: 120, sigma_g: 0},    duration: 10}
  SurveillancePatrol: {category: security,    reward: {median: 180, sigma_g: 0.35}, duration: {mean: 30, sd: 10, min: 10}}
  ComponentRestock:   {category: logistics,   reward: {median: 120, sigma_g: 0},    duration: 10}
